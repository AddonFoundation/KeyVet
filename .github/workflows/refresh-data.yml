name: Refresh Keyvet Data

on:
  schedule:
    - cron: '0 */6 * * *'   # every 6 hours — adjust once you see real runtime/API cost
  workflow_dispatch: {}       # lets you trigger manually from the Actions tab

jobs:
  crawl-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r crawler/requirements.txt

      - name: Crawl Raider.IO runs feed
        env:
          RAIDERIO_API_KEY: ${{ secrets.RAIDERIO_API_KEY }}
        run: python crawler/fetch_runs.py --min-level 6 --out crawler/raw_runs.json

      - name: Build Lua data file
        run: python crawler/build_lua.py --in crawler/raw_runs.json --out addon/db/keyvet_data.lua

      - name: Package addon zip
        run: |
          cd addon
          zip -r ../Keyvet.zip .

      - name: Commit updated data file
        run: |
          git config user.name "keyvet-bot"
          git config user.email "actions@users.noreply.github.com"
          git add addon/db/keyvet_data.lua
          git diff --staged --quiet || git commit -m "Data refresh $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          files: Keyvet.zip
          name: Keyvet data refresh ${{ github.run_number }}
